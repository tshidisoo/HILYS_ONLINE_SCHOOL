<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HILYS Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: one big card centred for Zoom screen sharing; small controls above and below. */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --ink: #141a3a; --muted: #4a5170; --line: #dde0ec;
  --navy: #1f2f86; --orange: #e8642c; --teal: #138a8a; --on-accent: #ffffff;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d18; --surface: #151a2e; --ink: #eef0f8; --muted: #a8aecb; --line: #2a3150;
    --navy: #8fa2ff; --orange: #f5824f; --teal: #3cc4c0; --on-accent: #0b0d18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d18; --surface: #151a2e; --ink: #eef0f8; --muted: #a8aecb; --line: #2a3150;
  --navy: #8fa2ff; --orange: #f5824f; --teal: #3cc4c0; --on-accent: #0b0d18; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.5 var(--font-body);
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar {
  display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between;
  padding-block: 0.9rem; max-width: 1000px; width: 100%; margin: 0 auto;
}
.brand { font: 800 1.1rem/1 var(--font-display); letter-spacing: 0.04em; color: var(--navy); }
.sets { display: flex; flex-wrap: wrap; gap: 0.4rem; }
button {
  font: 600 0.95rem/1 var(--font-body); cursor: pointer; border-radius: 999px;
  padding: 0.55rem 1rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
button:hover { border-color: var(--orange); }
button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-accent); }
.stage { flex: 1; display: grid; place-items: center; padding-block: 1rem; min-height: 0; }
.card {
  width: min(760px, 100%); aspect-ratio: 4 / 3; max-height: 70vh; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 28px;
  display: grid; place-items: center; align-content: center; gap: 1.2rem; text-align: center;
  padding: 2rem; cursor: pointer; user-select: none;
  box-shadow: 0 10px 30px color-mix(in srgb, var(--navy) 12%, transparent);
}
.pic { font-size: clamp(4rem, 14vw, 9rem); line-height: 1; }
.word { font: 800 clamp(2.4rem, 7vw, 5rem)/1.05 var(--font-display); color: var(--navy); overflow-wrap: anywhere; }
.english { font: 600 clamp(1.3rem, 3vw, 2rem)/1.2 var(--font-body); color: var(--orange); min-height: 1.2em; }
.english[data-hidden="true"] { visibility: hidden; }
.foot {
  display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: center;
  padding-block: 0.9rem 1.2rem;
}
.count { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5rem; text-align: center; }
.hint { color: var(--muted); font-size: 0.85rem; text-align: center; padding-bottom: 1rem; }
@media (prefers-reduced-motion: no-preference) {
  .card.pop { animation: pop 0.25s ease-out; }
  @keyframes pop { from { transform: scale(0.97); } to { transform: scale(1); } }
}
</style>
</head>
<body>

<div class="bar">
  <span class="brand">HILYS</span>
  <div class="sets" id="sets" role="group" aria-label="Choose a lesson"></div>
</div>

<main class="stage">
  <div class="card" id="card" role="button" tabindex="0" aria-label="Flashcard. Click to show the English.">
    <div class="pic" id="pic" aria-hidden="true"></div>
    <div class="word" id="word" lang="nr"></div>
    <div class="english" id="english" data-hidden="true"></div>
  </div>
</main>

<div class="foot">
  <button id="prev" type="button">← Back</button>
  <span class="count" id="count"></span>
  <button id="next" type="button">Next →</button>
  <button id="flip" type="button">Show English</button>
  <button id="shuffle" type="button">Shuffle</button>
</div>
<p class="hint">Keys: → next, ← back, space shows English, S shuffles.</p>

<script>
// Card sets. To change a word, edit the text between the quotes and save.
// Each card is: [picture, isiNdebele, English]. All isiNdebele here is a draft to check.
var SETS = {
  "Trial": [
    ["👋", "Salibonani!", "Hello!"],
    ["👩", "umama", "mother"],
    ["🐕", "inja", "dog"],
    ["🐄", "inkomo", "cow"],
    ["🍞", "isinkwa", "bread"],
    ["💧", "amanzi", "water"]
  ],
  "Lesson 1": [
    ["👋", "Salibonani", "Hello (respectful / to many)"],
    ["🙋", "Sawubona", "Hello (to one person)"],
    ["🤷", "Unjani?", "How are you?"],
    ["👍", "Ngiyaphila", "I am well"],
    ["👉", "Lawe unjani?", "And you, how are you?"],
    ["🙏", "Ngiyabonga", "Thank you"],
    ["🙂", "Ibizo lami ngu…", "My name is…"],
    ["👋", "Sala kuhle", "Goodbye (stay well)"]
  ],
  "Lesson 2": [
    ["👩", "umama", "mother"],
    ["👨", "ubaba", "father"],
    ["👵", "ugogo", "grandmother"],
    ["👴", "ubabamkhulu", "grandfather"],
    ["🧒", "umntwana", "child"],
    ["👧", "usisi", "sister"],
    ["👦", "ubhudi", "brother"],
    ["👨‍👩‍👧‍👦", "umndeni", "family"],
    ["🐇", "uNogwaja", "the hare"]
  ],
  "Lesson 3": [
    ["1️⃣", "okukodwa", "one"],
    ["2️⃣", "okubili", "two"],
    ["3️⃣", "okuthathu", "three"],
    ["4️⃣", "okune", "four"],
    ["5️⃣", "okuhlanu", "five"],
    ["6️⃣", "isithupha", "six"],
    ["7️⃣", "isikhombisa", "seven"],
    ["8️⃣", "isificaminwembili", "eight"],
    ["9️⃣", "isificamunwemunye", "nine"],
    ["🔟", "itshumi", "ten"],
    ["🍿", "amaputi", "popcorn (maputi)"]
  ],
  "Lesson 4": [
    ["🔴", "-bomvu", "red"],
    ["🟢", "-luhlaza", "green / blue"],
    ["🟡", "-phuzi", "yellow"],
    ["⚪", "-mhlophe", "white"],
    ["⚫", "-mnyama", "black"],
    ["🍚", "isitshwala", "maize porridge"],
    ["🍖", "inyama", "meat"],
    ["🥬", "imbuya", "leafy greens"],
    ["🥛", "amasi", "sour milk"]
  ],
  "Lesson 5": [
    ["🐕", "inja", "dog"],
    ["🐈", "ikati", "cat"],
    ["🐄", "inkomo", "cow"],
    ["🐐", "imbuzi", "goat"],
    ["🐔", "inkukhu", "chicken"],
    ["🦁", "isilwane", "lion"],
    ["🐘", "indlovu", "elephant"],
    ["🐇", "unogwaja", "hare"]
  ],
  "Lesson 6": [
    ["🙆", "ikhanda", "head"],
    ["👀", "amehlo", "eyes"],
    ["👂", "indlebe", "ear"],
    ["👃", "ikhala", "nose"],
    ["👄", "umlomo", "mouth"],
    ["✋", "isandla", "hand"],
    ["🦶", "unyawo", "foot"],
    ["🦵", "amadolo", "knees"]
  ],
  "Lesson 7": [
    ["🏠", "indlu", "house"],
    ["🏡", "ikhaya", "home"],
    ["🛖", "umuzi", "homestead"],
    ["🚪", "umnyango", "door"],
    ["🪟", "ifasitela", "window"],
    ["🍽️", "itafula", "table"],
    ["🪑", "isihlalo", "chair"],
    ["🛏️", "umbheda", "bed"],
    ["⏰", "Ngiyavuka", "I wake up"],
    ["😴", "Ngiyalala", "I sleep"]
  ],
  "Lesson 9": [
    ["📅", "uMvulo", "Monday"],
    ["📅", "uLwesibili", "Tuesday"],
    ["📅", "uLwesithathu", "Wednesday"],
    ["📅", "uLwesine", "Thursday"],
    ["📅", "uLwesihlanu", "Friday"],
    ["🎉", "uMgqibelo", "Saturday"],
    ["⛪", "iSonto", "Sunday"],
    ["☀️", "Kuyatshisa", "It's hot"],
    ["🥶", "Kuyaqanda", "It's cold"],
    ["🌧️", "Liyana", "It's raining"]
  ],
  "Lesson 10": [
    ["👕", "ihembe", "shirt"],
    ["👖", "ibhulukwe", "trousers"],
    ["👗", "ingubo", "dress"],
    ["👟", "izicathulo", "shoes"],
    ["🧢", "isigqoko", "hat"],
    ["🧦", "amasokisi", "socks"],
    ["🧥", "ijezi", "jumper"]
  ],
  "Lesson 11": [
    ["🧺", "imakethe", "market"],
    ["💵", "imali", "money"],
    ["🛒", "ukuthenga", "to buy"],
    ["🏪", "ukuthengisa", "to sell"],
    ["🍌", "ibhanana", "banana"],
    ["🍅", "utamatisi", "tomato"],
    ["🌽", "umbila", "maize"],
    ["🍄", "amakhowa", "mushrooms"],
    ["❓", "Yimalini?", "How much is it?"]
  ],
  "Lesson 13": [
    ["😄", "Ngiyathokoza", "I'm happy"],
    ["😢", "Ngidabukile", "I'm sad"],
    ["😠", "Ngithukuthele", "I'm angry"],
    ["😨", "Ngiyesaba", "I'm scared"],
    ["🥱", "Ngidiniwe", "I'm tired"],
    ["🍽️", "Ngilambile", "I'm hungry"]
  ],
  "Lesson 14": [
    ["🏃", "ukugijima", "to run"],
    ["⚽", "ukudlala", "to play"],
    ["🎤", "ukucula", "to sing"],
    ["💃", "ukudansa", "to dance"],
    ["🚶", "ukuhamba", "to walk"],
    ["📖", "ukubala", "to read / count"],
    ["✏️", "ukubhala", "to write"],
    ["🛌", "ukulala", "to sleep"]
  ]
};
// Family shows (lessons 8 and 16) use every set from that month together.
SETS["Family show"] = [].concat(
  SETS["Lesson 1"], SETS["Lesson 2"], SETS["Lesson 3"], SETS["Lesson 4"],
  SETS["Lesson 5"], SETS["Lesson 6"], SETS["Lesson 7"]
);
SETS["Month 2"] = [].concat(
  SETS["Lesson 9"], SETS["Lesson 10"], SETS["Lesson 11"], SETS["Lesson 13"], SETS["Lesson 14"]
);

var names = Object.keys(SETS);
var current = names[0], order = [], i = 0, shown = false;
var $ = function (id) { return document.getElementById(id); };

function load(name) {
  current = name;
  order = SETS[name].map(function (_, k) { return k; });
  i = 0;
  try { localStorage.setItem("hilys-set", name); } catch (e) {}
  document.querySelectorAll("#sets button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.textContent === name ? "true" : "false");
  });
  render();
}

function render() {
  var c = SETS[current][order[i]];
  $("pic").textContent = c[0];
  $("word").textContent = c[1];
  $("english").textContent = c[2];
  shown = false;
  $("english").dataset.hidden = "true";
  $("flip").textContent = "Show English";
  $("count").textContent = (i + 1) + " / " + order.length;
  var card = $("card");
  card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
}

function flip() {
  shown = !shown;
  $("english").dataset.hidden = shown ? "false" : "true";
  $("flip").textContent = shown ? "Hide English" : "Show English";
}
function step(d) { i = (i + d + order.length) % order.length; render(); }
function shuffle() {
  for (var k = order.length - 1; k > 0; k--) {
    var j = Math.floor(Math.random() * (k + 1)); var t = order[k]; order[k] = order[j]; order[j] = t;
  }
  i = 0; render();
}

names.forEach(function (n) {
  var b = document.createElement("button");
  b.type = "button"; b.textContent = n;
  b.addEventListener("click", function () { load(n); $("card").focus(); });
  $("sets").appendChild(b);
});
$("card").addEventListener("click", flip);
$("card").addEventListener("keydown", function (e) { if (e.key === "Enter") flip(); });
$("flip").addEventListener("click", flip);
$("next").addEventListener("click", function () { step(1); });
$("prev").addEventListener("click", function () { step(-1); });
$("shuffle").addEventListener("click", shuffle);
document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === " ") { e.preventDefault(); flip(); }
  else if (e.key.toLowerCase() === "s") shuffle();
});

var saved = null;
try { saved = localStorage.getItem("hilys-set"); } catch (e) {}
load(SETS[saved] ? saved : names[0]);
</script>
</body>
</html>
